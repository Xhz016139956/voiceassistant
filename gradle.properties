# 本机物理内存 15GB 且常只剩 1~2GB 可用，这里刻意把 Gradle 压到单 JVM 运行：
# - 堆 896m + metaspace 576m + code cache 96m ≈ 1.6GB 峰值
# - Kotlin 编译器 in-process 复用同一个 JVM，避免再开一个 512m 的 daemon 把内存撑爆
org.gradle.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=576m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process

# 更新源仓库（owner/repo）。写在这里的意义：本地构建也带更新源，
# 不必非得用 GitHub Actions 构建才不提示「未配置更新源」。
# CI 用 -PupdateRepo=... 传参，命令行参数的优先级高于本文件，可覆盖。
updateRepo=Xhz016139956/voiceassistant

android.useAndroidX=true
android.nonTransitiveRClass=true
# 工作区路径含中文，AGP 默认会拒绝构建；这里显式放行
android.overridePathCheck=true
kotlin.code.style=official
